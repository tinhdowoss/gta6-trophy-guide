<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonida Ledger — GTA VI trophy guide &amp; platinum tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23b4232a'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='Georgia'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/print-theme.css">
  <link rel="stylesheet" href="css/cover-layout.css">
  <link rel="stylesheet" href="css/checklist-column.css">
  <link rel="stylesheet" href="css/guide-column.css">
  <link rel="stylesheet" href="css/views.css">
  <script type="module" src="js/boot-app.js"></script>
</head>
<body>
  <header id="ledger-header">
    <div id="brand"><b>LEONIDA LEDGER</b><span>GTA VI · PS5 trophy guide &amp; platinum tracker</span></div>
    <div id="total-progress" aria-label="Total progress"></div>
    <div id="grade-progress" aria-label="Progress per grade"></div>
    <div id="header-actions">
      <button id="export-progress" type="button" title="Download your progress as a JSON file">⇩ Export</button>
      <label id="import-progress-label" class="button-like" title="Load a progress file">⇧ Import<input id="import-progress" type="file" accept=".json,application/json" hidden></label>
      <button id="spoiler-toggle" type="button" aria-pressed="true">Spoilers hidden</button>
    </div>
  </header>
  <section id="audit-strip" aria-label="Data audit, computed from trophies.json"></section>
  <nav id="toolbar">
    <div id="view-tabs" role="tablist">
      <button role="tab" data-view="guide">Guide</button>
      <button role="tab" data-view="roadmap">Roadmap</button>
      <button role="tab" data-view="missables">Missables</button>
      <button role="tab" data-view="progress">Progress</button>
    </div>
    <div id="filter-chips" aria-label="Filter by kind"></div>
    <select id="grade-filter" aria-label="Filter by grade">
      <option value="">All grades</option><option value="platinum">Platinum</option><option value="gold">Gold</option>
      <option value="silver">Silver</option><option value="bronze">Bronze</option>
    </select>
    <select id="status-filter" aria-label="Filter by status">
      <option value="">Earned + to do</option><option value="todo">To do</option><option value="earned">Earned</option>
    </select>
    <input id="trophy-search" type="search" placeholder="Search name, mission, tip…" aria-label="Search trophies">
  </nav>
  <main id="ledger-main">
    <section id="guide-view" class="view">
      <aside id="checklist-column" aria-label="Trophy checklist"></aside>
      <article id="trophy-guide" aria-live="polite"></article>
      <aside id="sources-column" aria-label="Sources and next up"></aside>
    </section>
    <section id="roadmap-view" class="view" hidden></section>
    <section id="missables-view" class="view" hidden></section>
    <section id="progress-view" class="view" hidden>
      <aside id="progress-checklist" aria-label="Filtered checklist"></aside>
      <div id="progress-stats"></div>
    </section>
  </main>
  <p id="toast" role="status" hidden></p>
</body>
</html>
